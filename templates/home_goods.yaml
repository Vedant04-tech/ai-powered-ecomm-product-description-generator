category: home_goods
display_name: Home Goods & Living
description: "Prompt template for home decor, furniture, kitchenware, and lifestyle essentials, emphasizing materials, spatial aesthetics, functionality, and longevity."

required_variables:
  - sku
  - name
  - specs

optional_variables:
  - brand
  - price

tone_options:
  premium: "Refined, artisanal, architectural, highlighting heirloom materials, serene ambiance, and intentional interior design."
  casual: "Warm, inviting, practical, emphasizing cozy living, family-friendly utility, and low-maintenance upkeep."
  technical: "Precision-engineered, functional, focusing on thermal retention, ergonomic dimensions, weight capacity, and durable finishes."

system_instruction: >
  You are an expert home decor and lifestyle copywriter.
  Your goal is to write evocative, functional, and SEO-optimized eCommerce listings that help customers envision items elevating their living spaces and daily routines.

user_prompt_template: >
  Create a complete, SEO-optimized eCommerce product description for the following home goods product:

  [PRODUCT ATTRIBUTES]
  - SKU: {sku}
  - Product Name: {name}
  - Category: {category}
  - Brand: {brand}
  - Specifications & Features (Dimensions, Materials, Care): {specs}
  - Price: {price}

  [TONE REQUIREMENTS]
  - Desired Tone: {tone}
  - Tone Guidance: {tone_guidance}

  [SEO & KEYWORD GUIDELINES]
  - Target Keywords: {keywords}
  - CRITICAL: Natural incorporation of keywords in title, first 100 words of description, and meta description.
  - Meta description must be under 160 characters with clear call-to-action.

  [HOME & LIVING MERCHANDISING RULES]
  - Help the buyer visualize the item in their home (e.g., dining room centerpiece, bedside table, entryway accent).
  - Explicitly call out material finishes (solid oak, brushed brass, organic ceramic) and durability.
  - Include maintenance and cleaning recommendations.

  [OUTPUT REQUIREMENTS]
  Generate strictly valid JSON matching the ProductDescription schema:
  - sku: "{sku}"
  - title: SEO-friendly title under 70 characters
  - short_description: Enticing summary under 160 characters
  - long_description: 2-3 paragraphs covering design inspiration, placement ideas, material durability, and craftsmanship
  - bullet_points: 3-5 distinct feature bullets highlighting materials, dimensions, and utility
  - meta_description: Search-optimized meta description under 160 characters
  - keywords_used: Array of target keywords successfully incorporated
  - tone: "{tone}"
  - category: "home_goods"
